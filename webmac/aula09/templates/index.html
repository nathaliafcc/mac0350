<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Site - HTMX</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; transition: opacity 1s ease-out; }
        .htmx-swapping { opacity: 0; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        button { margin-right: 5px; cursor: pointer; }
        .paginacao { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Meu Site</h1>
    <p>Bem vindo ao meu site!</p>
    
    <nav>
        <button hx-get="/lista" hx-target="main">Lista de alunos</button>
        <button hx-get="/editarAlunos" hx-target="main">Editar lista de alunos</button>
        <button id="apagar" hx-delete="/apagar" hx-target="body" hx-swap="outerHTML swap:1s" hx-confirm="Deseja deletar meu site?">Deletar site</button>
    </nav>
    <hr>
    
    <main hx-get="{{ pagina }}" hx-target="main" hx-trigger="load"></main>

    <script>
        document.getElementById("apagar").addEventListener("htmx:confirm", (e) => {
            e.preventDefault();
            Swal.fire({
                title: "Prosseguir?",
                text: e.detail.question,
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sim, deletar",
                cancelButtonText: "Cancelar"
            }).then(result => {
                if (result.isConfirmed) e.detail.issueRequest(true);
            });
        });
    </script>
</body>
</html>
