<div id="lista-container">
    <input type="text" 
           name="busca" 
           value="{{ busca }}"
           placeholder="Buscar..."
           hx-get="/lista"
           hx-target="#lista-container"
           hx-trigger="input changed delay:500ms"
           hx-indicator="#indicator"
           hx-select="#lista-container">
    
    <span id="indicator" class="htmx-indicator">Carregando...</span>

    <div id="lista-alunos">
        <ul>
            {% for aluno in alunos %}
                <li>{{ aluno.id }} - {{ aluno.nome }}</li>
            {% else %}
                <li>Não há alunos</li>
            {% endfor %}
        </ul>
    </div>

    <div class="paginacao">
        <button hx-get="/lista?busca={{ busca }}&p={{ p - 1 }}"
                hx-target="#lista-container"
                hx-select="#lista-container"
                {% if not tem_anterior %}disabled{% endif %}>
            Anterior
        </button>
        
        <button hx-get="/lista?busca={{ busca }}&p={{ p + 1 }}"
                hx-target="#lista-container"
                hx-select="#lista-container"
                {% if not tem_proximo %}disabled{% endif %}>
            Próximo
        </button>
    </div>
</div>
